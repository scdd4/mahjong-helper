<!DOCTYPE html>
<html><head><meta charset="utf-8"><style>
  body { margin:0; background:#14351f; padding:24px 20px; }
  .row { display:flex; gap:8px; }
  .t { width:86px; height:120px; border-radius:8px; background:linear-gradient(#fffdf5,#efe6d2);
       box-shadow: inset 0 -5px 0 rgba(120,100,60,.3);
       display:flex; flex-direction:column; align-items:center; justify-content:center;
       font-family:"Microsoft YaHei",sans-serif; color:#222; }
  .n { font-size:44px; font-weight:800; line-height:1; }
  .s { font-size:20px; margin-top:4px; font-weight:600; }
  .honor .n { font-size:52px; }
  .man { color:#b62f2a } .pin { color:#1b4f8c } .sou { color:#136b3f } .honor { color:#333 }
  /* 第二张图：真实麻将字形 */
  .glyph { font-family:"Segoe UI Symbol","Noto Sans Symbols 2",serif; font-size:104px; line-height:1;
           color:#f4f4f4; text-shadow:0 2px 3px rgba(0,0,0,.6); }
</style></head>
<body>

<!-- 手牌 A：数字+花色文字风格 -->
<div class="row" id="a">
  <div class="t man"><span class="n">1</span><span class="s">万</span></div>
  <div class="t man"><span class="n">2</span><span class="s">万</span></div>
  <div class="t man"><span class="n">3</span><span class="s">万</span></div>
  <div class="t man"><span class="n">4</span><span class="s">万</span></div>
  <div class="t man"><span class="n">5</span><span class="s">万</span></div>
  <div class="t man"><span class="n">6</span><span class="s">万</span></div>
  <div class="t man"><span class="n">7</span><span class="s">万</span></div>
  <div class="t man"><span class="n">8</span><span class="s">万</span></div>
  <div class="t man"><span class="n">9</span><span class="s">万</span></div>
  <div class="t pin"><span class="n">2</span><span class="s">筒</span></div>
  <div class="t pin"><span class="n">3</span><span class="s">筒</span></div>
  <div class="t pin"><span class="n">4</span><span class="s">筒</span></div>
  <div class="t pin"><span class="n">5</span><span class="s">筒</span></div>
  <div class="t honor"><span class="n">北</span></div>
</div>

</body></html>
